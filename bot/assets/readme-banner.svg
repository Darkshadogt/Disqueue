<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1" cx="25%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#4C3BAA" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#4C3BAA" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#9B30FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#9B30FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow3" cx="55%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#6F52CC" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6F52CC" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B72FF" />
      <stop offset="55%" stop-color="#C060FF" />
      <stop offset="100%" stop-color="#D999FF" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#2E2E48" stroke-width="1" opacity="0.35" />
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="#0A0A12" />
  <rect width="1200" height="320" fill="url(#grid)" />
  <rect width="1200" height="320" fill="url(#glow1)" />
  <rect width="1200" height="320" fill="url(#glow2)" />
  <rect width="1200" height="320" fill="url(#glow3)" />

  <text x="600" y="168" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="72" font-weight="700" letter-spacing="2" fill="url(#wordmark)">DISQUEUE</text>

  <text x="600" y="212" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="20" fill="#C8C8E0">Presence-based matchmaking for Discord, across every server it's in.</text>

  <line x1="500" y1="240" x2="700" y2="240" stroke="#2E2E48" stroke-width="1" />

  <circle cx="600" cy="240" r="3" fill="#0FFB8A" />
</svg>
